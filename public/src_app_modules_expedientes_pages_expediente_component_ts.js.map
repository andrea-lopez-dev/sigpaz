<div class="book-viewer-overlay" *ngIf="denuncia" (click)="cerrar.emit()">
  <div class="book-container" (click)="$event.stopPropagation()">

    <!-- Barra de herramientas -->
    <div class="book-toolbar">
      <div class="toolbar-left">
        <button class="tool-btn" (click)="cerrar.emit()">
          <span class="btn-icon">✕</span> Cerrar
        </button>
        <div class="book-info">
          <span class="book-number">Expediente #{{ denuncia.numero_expediente || denuncia.id_denuncia || 'N/A' }}</span>
          <span class="book-title">{{ denuncia.tipo_denuncia || 'Expediente' }}</span>
        </div>
      </div>
      <div class="toolbar-right">
        <button class="tool-btn" (click)="imprimirPagina()">
          <span class="btn-icon">🖨️</span> Imprimir
        </button>
        <button class="tool-btn" (click)="exportarPDF()">
          <span class="btn-icon">📄</span> PDF
        </button>
        <button class="tool-btn" (click)="toggleFullscreen()">
          <span class="btn-icon">⛶</span> Pantalla completa
        </button>
        <div class="page-controls">
          <button class="page-btn" (click)="paginaAnterior()" [disabled]="paginaActual === 1">
            ◀
          </button>
          <span class="page-info">Página {{ paginaActual }} de {{ totalPaginas }}</span>
          <button class="page-btn" (click)="paginaSiguiente()" [disabled]="paginaActual === totalPaginas">
            ▶
          </button>
        </div>
      </div>
    </div>

    <!-- Libro - SIN flipped que rota todo -->
    <div class="book-wrapper">
      <div class="book">

        <!-- Página izquierda -->
        <div class="page left-page" [class.turning]="isTurningLeft">
          <div class="page-content" *ngIf="paginaActual - 1 >= 0 && paginas[paginaActual - 1]">
            <ng-container *ngTemplateOutlet="paginaContenido; context: { $implicit: paginas[paginaActual - 1] }"></ng-container>
          </div>
          <div class="page-number">{{ paginaActual - 1 }}</div>
        </div>

        <!-- Página derecha -->
        <div class="page right-page" [class.turning]="isTurningRight">
          <div class="page-content" *ngIf="paginas[paginaActual]">
            <ng-container *ngTemplateOutlet="paginaContenido; context: { $implicit: paginas[paginaActual] }"></ng-container>
          </div>
          <div class="page-number">{{ paginaActual }}</div>
        </div>

        <!-- Efecto de sombra central -->
        <div class="book-center-shadow"></div>
      </div>
    </div>

    <!-- Barra de progreso -->
    <div class="book-progress" *ngIf="totalPaginas > 0">
      <div class="progress-bar" [style.width.%]="(paginaActual / totalPaginas) * 100"></div>
    </div>

  </div>
</div>

<ng-template #paginaContenido let-pagina>
  <div class="book-page-content">
    <div class="page-header" *ngIf="pagina.titulo">
      <h2>{{ pagina.titulo }}</h2>
      <div class="page-decoration"></div>
    </div>

    <div class="page-body" [innerHTML]="pagina.contenido | safeHtml"></div>

    <div class="page-footer" *ngIf="pagina.firma">
      <div class="signature-line">
        <span>___________________</span>
        <span>{{ pagina.firma }}</span>
      </div>
    </div>
  </div>
</ng-template>
