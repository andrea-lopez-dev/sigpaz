<div class="modal-overlay" (click)="cerrar.emit()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ prestamoEditando ? '✏️ Editar Préstamo' : '📚 Solicitar Préstamo de Expediente' }}</h2>
      <button class="modal-close" (click)="cerrar.emit()">×</button>
    </div>

    <div class="modal-content">
      <form (ngSubmit)="guardar()" #prestamoForm="ngForm">
        <div class="form-grid">
          <div class="form-group">
            <label>Denuncia <span class="required">*</span></label>
            <!-- ✅ Quitar los paréntesis () -->
            <select [(ngModel)]="formData.denuncia_id" name="denuncia_id" required class="form-select">
              <option [value]="null">Seleccione una denuncia</option>
              <option *ngFor="let denuncia of denunciasDisponibles" [value]="denuncia.id_denuncia">
                DEN-{{ denuncia.id_denuncia.toString().padStart(4, '0') }} - {{ denuncia.tipo_denuncia }}
              </option>
            </select>
          </div>

          <div class="form-group">
            <label>Personal Solicitante <span class="required">*</span></label>
            <!-- ✅ Quitar los paréntesis () -->
            <select [(ngModel)]="formData.personal_id" name="personal_id" required class="form-select">
              <option [value]="null">Seleccione personal</option>
              <option *ngFor="let personal of personalDisponible" [value]="personal.id_personal">
                {{ personal.nombre_completo }} - {{ personal.cargo }}
              </option>
            </select>
          </div>

          <div class="form-group">
            <label>Fecha Préstamo <span class="required">*</span></label>
            <input type="datetime-local" [(ngModel)]="formData.fecha_prestamo" name="fecha_prestamo" required class="form-input">
          </div>

          <div class="form-group">
            <label>Fecha Devolución Prevista <span class="required">*</span></label>
            <input type="datetime-local" [(ngModel)]="formData.fecha_retorno_prevista" name="fecha_retorno_prevista" required class="form-input">
          </div>

          <div class="form-group full-width">
            <label>Motivo del Préstamo <span class="required">*</span></label>
            <textarea [(ngModel)]="formData.motivo" name="motivo" required rows="4" class="form-textarea"
                      placeholder="Describa el motivo del préstamo..."></textarea>
          </div>

          <div class="form-group full-width">
            <label class="checkbox-label">
              <input type="checkbox" [(ngModel)]="aceptaTerminos" name="aceptaTerminos" required>
              Acepto los términos y condiciones del préstamo
            </label>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-cancel" (click)="cerrar.emit()">Cancelar</button>
          <button type="submit" class="btn-primary" [disabled]="!prestamoForm.form.valid || !aceptaTerminos">
            {{ prestamoEditando ? 'Actualizar' : 'Solicitar' }} Préstamo
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
