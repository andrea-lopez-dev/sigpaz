<footer class="footer-modern" [class.sidebar-collapsed]="isSidebarCollapsed">
  <div class="container">
    <div class="footer-content">
      <div class="footer-brand">
        <div class="brand-icon">
          <i class="pi pi-gavel"></i>
        </div>
        <div class="logo-text">
          <img src="/images/logo_sigpaz.png" alt="Justicia 3D Logo" class="logo-image">
        </div>
        <p>Sistema Integral de Gestión para la Paz</p>
      </div>

      <div class="footer-links">
        <div class="links-group">
          <h4>Contacto</h4>
          <!-- Contacto y contacte lado a lado -->
          <div class="contact-row">
            <a href="mailto:info@justiciapaz.gob" class="contact-link">info@justiciapaz.gob</a>
            <span class="contact-separator">|</span>
            <a href="mailto:contacto@justiciapaz.gob" class="contact-link contacte-link">contacte</a>
          </div>
          <div class="contact-row">
            <a href="tel:800-JUSTICIA" class="contact-link">800-JUSTICIA</a>
            <span class="contact-separator">|</span>
            <a href="tel:800-CONTACTO" class="contact-link contacte-link">contacte</a>
          </div>
          <div class="social-icons">
            <a href="#" target="_blank"><i class="pi pi-facebook"></i></a>
            <a href="#" target="_blank"><i class="pi pi-twitter"></i></a>
            <a href="#" target="_blank"><i class="pi pi-instagram"></i></a>
            <a href="#" target="_blank"><i class="pi pi-linkedin"></i></a>
          </div>
        </div>
      </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; {{ currentYear }} SIGPAZ. Todos los derechos reservados.</p>
      <!-- Certificaciones y Seguridad -->
  <div class="security-badges">
    <div class="badge-group">
      <span class="cert-badge ssl" title="Conexión segura SSL/TLS">
        <i class="pi pi-lock"></i> SSL Seguro
      </span>
      <span class="cert-badge gdpr" title="Cumplimiento GDPR">
        <i class="pi pi-shield"></i> GDPR
      </span>
      <span class="cert-badge iso" title="Certificación ISO 27001">
        <i class="pi pi-check-circle"></i> ISO 27001
      </span>
      <span class="cert-badge wcag" title="Accesibilidad WCAG 2.1 AA">
        <i class="pi pi-users"></i> WCAG 2.1 AA
      </span>
    </div>

    <div class="badge-group">
      <span class="cert-badge roles" *ngIf="currentUserRole" [title]="'Rol actual: ' + currentUserRole">
        <i class="pi pi-id-card"></i> Rol: {{ currentUserRole }}
      </span>
      <span class="cert-badge auth" *ngIf="isAuthenticated" title="Autenticación activa">
        <i class="pi pi-check"></i> Autenticado
      </span>
      <span class="cert-badge mfa" *ngIf="hasMFA" title="Autenticación de dos factores">
        <i class="pi pi-mobile"></i> 2FA Activo
      </span>
    </div>
  </div>
</div>
    </div>

  <!-- Botón volver arriba -->
  <button
    class="back-to-top"
    [class.visible]="isScrolled"
    (click)="scrollToTop()"
    aria-label="Volver arriba">
    ↑
  </button>
</footer>
