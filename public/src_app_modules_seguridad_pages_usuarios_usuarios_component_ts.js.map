<div class="filtros-container">
  <div class="filtros-header">
    <h3>Filtros de Búsqueda</h3>
    <button class="btn-link" (click)="resetFilters()">Limpiar filtros</button>
  </div>

  <!-- ✅ IMPORTANTE: Envolver con formGroup -->
  <form [formGroup]="filterForm" class="filtros-grid">
    <div class="filter-item">
      <input
        type="text"
        formControlName="search"
        placeholder="🔍 Buscar por nombre o email..."
        class="filter-input">
    </div>

    <div class="filter-item">
  <select formControlName="rol_id" class="filter-select">
    <option [value]="null">Todos los roles</option>
    <option *ngFor="let rol of roles" [value]="rol.rol_id">
      {{ rol.nombre }}
    </option>
  </select>
</div>

    <div class="filter-item">
      <select formControlName="activo" class="filter-select">
        <option [value]="null">Todos los estados</option>
        <option [value]="true">Activos</option>
        <option [value]="false">Inactivos</option>
      </select>
    </div>

    <div class="filter-item">
      <button type="button" class="btn btn-secondary" (click)="resetFilters()">
        Limpiar filtros
      </button>
    </div>
  </form>
</div>
