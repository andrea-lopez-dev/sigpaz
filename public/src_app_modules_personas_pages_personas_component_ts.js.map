<!-- firma-modal.component.html -->
<div class="modal-overlay" (click)="cerrarModal()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Agregar Firma</h3>
      <button class="modal-close" (click)="cerrarModal()">&times;</button>
    </div>

    <div class="modal-body">
      <!-- Canvas para dibujar -->
      <div class="firma-container">
        <canvas #firmaCanvas
                width="600"
                height="300"
                class="firma-canvas">
        </canvas>

        <div class="firma-controls">
          <button class="btn btn-sm btn-secondary" (click)="limpiarFirma()">
            <span class="btn-icon">🗑️</span>
            Limpiar
          </button>
          <button class="btn btn-sm btn-secondary" (click)="deshacer()" [disabled]="!puedeDeshacer">
            <span class="btn-icon">↩️</span>
            Deshacer
          </button>
          <div class="color-picker">
            <label>Color:</label>
            <input type="color" [(ngModel)]="colorFirma" (change)="cambiarColor()">
          </div>
          <div class="grosor-linea">
            <label>Grosor: {{grosorLinea}}px</label>
            <input type="range" min="1" max="10" [(ngModel)]="grosorLinea" (change)="cambiarGrosor()">
          </div>
        </div>
      </div>

      <!-- Vista previa -->
      <div class="preview-container" *ngIf="firmaDataURL">
        <h4>Vista previa:</h4>
        <img [src]="firmaDataURL" alt="Vista previa firma" class="preview-image">
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-cancel" (click)="cerrarModal()">
        Cancelar
      </button>
      <button type="button" class="btn btn-primary" (click)="guardarFirma()" [disabled]="!firmaDataURL">
        <span class="btn-icon">💾</span>
        Guardar Firma
      </button>
    </div>
  </div>
</div>
