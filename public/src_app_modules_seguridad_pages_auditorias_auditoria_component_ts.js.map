<div class="filtros-container">
  <div class="filtros-basicos">
    <div class="filtro-group">
      <label>Fecha inicio</label>
      <input type="date" [(ngModel)]="filtros.fecha_inicio">
    </div>
    <div class="filtro-group">
      <label>Fecha fin</label>
      <input type="date" [(ngModel)]="filtros.fecha_fin">
    </div>
    <div class="filtro-group">
      <label>Usuario</label>
      <select [(ngModel)]="filtros.usuario_id">
        <option [value]="null">Todos</option>
        <option *ngFor="let usuario of usuarios" [value]="usuario.usuario_id">
          {{ usuario.nombre_usuario }}
        </option>
      </select>
    </div>
    <div class="filtro-actions">
      <button class="btn btn-primary" (click)="aplicar()">Aplicar</button>
      <button class="btn btn-secondary" (click)="limpiar()">Limpiar</button>
      <button class="btn btn-link" (click)="toggleAvanzados()">
        {{ mostrarAvanzados ? 'Ocultar' : 'Mostrar' }} avanzados
      </button>
    </div>
  </div>

  <div class="filtros-avanzados" *ngIf="mostrarAvanzados">
    <div class="filtro-group">
      <label>Acciones</label>
      <div class="checkbox-group">
        <label *ngFor="let accion of accionesDisponibles">
          <input type="checkbox"
                 [value]="accion"
                 (change)="toggleAccion(accion)">
          {{ accion }}
        </label>
      </div>
    </div>
    <div class="filtro-group">
      <label>Tabla</label>
      <input type="text" [(ngModel)]="filtros.tabla_afectada" placeholder="Nombre de tabla">
    </div>
    <div class="filtro-group">
      <label>Palabra clave</label>
      <input type="text" [(ngModel)]="filtros.keyword" placeholder="Buscar en descripción">
    </div>
  </div>
</div>
