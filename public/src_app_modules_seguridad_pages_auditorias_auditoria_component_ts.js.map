<div class="export-panel">
  <div class="export-header">
    <h3>📤 Exportar Auditoría</h3>
  </div>

  <div class="export-options">
    <div class="form-group">
      <label>Formato:</label>
      <div class="format-buttons">
        <button *ngFor="let fmt of formatos"
                class="format-btn"
                [class.active]="formatoSeleccionado === fmt.value"
                (click)="formatoSeleccionado = fmt.value">
          <span class="icon">{{ fmt.icon }}</span>
          {{ fmt.label }}
        </button>
      </div>
    </div>

    <div class="export-actions">
      <button class="btn btn-primary" (click)="exportar()" [disabled]="exportando">
        <span *ngIf="exportando">⏳ Exportando...</span>
        <span *ngIf="!exportando">📥 Exportar {{ formatoSeleccionado.toUpperCase() }}</span>
      </button>
    </div>
  </div>
</div>
