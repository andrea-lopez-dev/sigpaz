<svg width="0" height="0" style="position:absolute">
  <linearGradient id="gradiente-paloma" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#8a2be2" />
    <stop offset="100%" stop-color="#87cefa" />
  </linearGradient>
</svg>

<div *ngIf="loading$ | async"
     class="loading-overlay"
     [class.dark-mode]="(themeService.darkMode$ | async)"
     [class.venezuela]="isVenezuelaTheme">
  <!-- Partículas flotantes -->
  <div class="particles">
   <div *ngFor="let p of particles" class="particle"
     [ngStyle]="{
       'left': p.x + '%',
       'top': p.y + '%',
       'animation-delay': p.delay + 's'
     }">
</div>
  </div>
<div *ngIf="isVenezuelaTheme" class="stars-container">
  <div class="star star-1">★</div>
  <div class="star star-2">★</div>
  <div class="star star-3">★</div>
  <div class="star star-4">★</div>
  <div class="star star-5">★</div>
  <div class="star star-6">★</div>
  <div class="star star-7">★</div>
  <div class="star star-8">★</div>
</div>
  <div class="loader" [class.venezuela]="isVenezuelaTheme">
    <!-- Pata izquierda -->

<p class="loading-message">{{ message$ | async }}</p>
<p class="loading-module" *ngIf="currentModule">
  <i class="pi pi-folder-open"></i> Módulo: {{ currentModule }}
</p>


  <!-- Botón para cambiar tema (solo demo, se puede quitar en producción) -->
  <button class="theme-toggle" (click)="toggleTheme()">
    Cambiar a tema {{ isVenezuelaTheme ? 'Sistema' : 'Tricolor' }}
  </button>
</div>
