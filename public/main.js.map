<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  [resizable]="false"
  [blockScroll]="true"
  [style]="{ width: '480px' }"
  [baseZIndex]="10000000"
  [styleClass]="'session-timeout-modal-bank'"
  [closeOnEscape]="false"
  [dismissableMask]="false"
  [focusOnShow]="true"
  [position]="'center'"
  [appendTo]="'body'"
  (onShow)="onModalShow()">

  <ng-template pTemplate="header">
    <div class="modal-header-bank">
      <div class="header-icon">
        <i class="pi pi-exclamation-triangle"></i>
      </div>
      <h3 class="header-title">Sesión por expirar</h3>
      <div class="header-badge">
        <i class="pi pi-lock"></i>
      </div>
    </div>
  </ng-template>

  <ng-template pTemplate="content">
    <div class="modal-content-bank">
      <!-- Mensaje de advertencia -->
      <div class="warning-message">
        <p>Por seguridad, su sesión se cerrará automáticamente debido a inactividad.</p>
      </div>

      <!-- Contador circular grande -->
      <div class="countdown-circle">
        <div class="circle-progress">
          <svg width="120" height="120" viewBox="0 0 120 120">
            <!-- Círculo de fondo -->
            <circle
              cx="60"
              cy="60"
              r="54"
              fill="none"
              stroke="var(--border-color)"
              stroke-width="6"
            />
            <!-- Círculo de progreso -->
            <circle
              cx="60"
              cy="60"
              r="54"
              fill="none"
              stroke="var(--warning)"
              stroke-width="6"
              stroke-linecap="round"
              [attr.stroke-dasharray]="circleCircumference"
              [attr.stroke-dashoffset]="circleOffset"
              transform="rotate(-90 60 60)"
            />
          </svg>
          <div class="countdown-text">
            <span class="time-number">{{ timeLeftFormatted }}</span>
            <span class="time-label">segundos restantes</span>
          </div>
        </div>
      </div>

      <!-- Barra de progreso (estilo banco) -->
      <div class="progress-section">
        <p-progressBar
          [value]="progressValue"
          [showValue]="false"
          styleClass="timeout-progress-bank"
          [style]="{ height: '6px' }">
        </p-progressBar>
      </div>

      <!-- Mensaje final -->
      <p class="final-message">
        Si no realiza ninguna acción, su sesión se cerrará automáticamente.
      </p>
    </div>
  </ng-template>

  <ng-template pTemplate="footer">
    <div class="modal-footer-bank">
      <button
        pButton
        pRipple
        type="button"
        label="Cerrar sesión"
        icon="pi pi-sign-out"
        class="p-button-text btn-logout-bank"
        (click)="logoutNow()">
      </button>

      <button
        pButton
        pRipple
        type="button"
        label="Continuar sesión"
        icon="pi pi-check"
        class="p-button-primary btn-continue-bank"
        (click)="keepSession()"
        [autofocus]="true">
      </button>
    </div>
  </ng-template>
</p-dialog>
