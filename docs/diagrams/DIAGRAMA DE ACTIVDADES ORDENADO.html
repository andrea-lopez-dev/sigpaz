        }
        .canvas-inner {
            position: relative; width: 6000px; height: 9500px; background: transparent;
        }
        
        /* Swimlanes */

        .swimlane-sistema .swimlane-header { background: #1a0a2a; color: #a78bfa; border-color: #a78bfa; }

        .module-box {
            position: absolute; border: 1px dashed #3a4b6a; border-radius: 8px;
            background: rgba(26,27,42,0.2); z-index: 1; pointer-events: none;
        }
        .module-title {
            position: absolute; top: -10px; left: 10px;
            background: #1a1b2a; padding: 2px 10px; border-radius: 12px;
            font-size: 9px; font-weight: bold; color: #a5f3c3;
            border: 1px solid #3a4b6a; z-index: 2;
        }
        .node {
            position: absolute; z-index: 5; display: flex; align-items: center;
            justify-content: center; text-align: center; font-size: 9px;
            font-weight: 500; padding: 6px 12px; border-radius: 6px;

        .node-action { background: #1e2a3a; border: 1px solid #3a4b6a; color: #e0e0f0; }
        .node-decision { background: #2a1e2a; border: 1px solid #facc15; color: #facc15; }
        .node-fork { background: #1a2a3a; border: 2px solid #60a5fa; color: #60a5fa; font-weight: bold; }
        .node-action:hover { background: #2d3a4a; transform: scale(1.03); z-index: 20; }
        .node-decision:hover { background: #3a2e3a; transform: scale(1.03); z-index: 20; }
        .connector-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
        .connector-line { stroke: #4a5b6a; stroke-width: 1.5; fill: none; }
        .connector-label { font-size: 7px; fill: #facc15; paint-order: stroke; stroke: #0f0f1a; stroke-width: 2px; }
        .legend {
            position: fixed; bottom: 12px; right: 12px; background: #1a1b2acc;

            border: 1px solid #2a2b3a; color: #e0e0f0; font-size: 8px; z-index: 80;

            padding: 4px 10px; border-radius: 16px; font-size: 9px;

    </style>
</head>

            if (!from || !to) return;
            const fr = from.getBoundingClientRect();
            const tr = to.getBoundingClientRect();
            const x1 = fr.left + fr.width/2 - cr.left;
            const y1 = fr.top + fr.height - cr.top;
            const x2 = tr.left + tr.width/2 - cr.left;
            const y2 = tr.top - cr.top;

            const line = document.createElementNS(ns, 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('stroke', '#4a5b6a');
            line.setAttribute('stroke-width', '1.5');
            svg.appendChild(line);

            const angle = Math.atan2(y2 - y1, x2 - x1);
            const as = 5;
            const ax = x2 - as * Math.cos(angle - Math.PI/6);
            const ay = y2 - as * Math.sin(angle - Math.PI/6);
            const bx = x2 - as * Math.cos(angle + Math.PI/6);
            const by = y2 - as * Math.sin(angle + Math.PI/6);
            const poly = document.createElementNS(ns, 'polygon');
            poly.setAttribute('points', `${x2},${y2} ${ax},${ay} ${bx},${by}`);
            poly.setAttribute('fill', '#4a5b6a');
            svg.appendChild(poly);

            if (c[2]) {
                const text = document.createElementNS(ns, 'text');
                text.setAttribute('x', (x1 + x2)/2 + 12);
                text.setAttribute('y', (y1 + y2)/2 - 4);
                text.setAttribute('fill', '#facc15');
                text.setAttribute('font-size', '7');
                text.textContent = c[2];
                svg.appendChild(text);
            }
        });
    }

    function applyZoom() {
        canvasInner.style.transform = `scale(${zoom})`;
        zoomLevel.textContent = Math.round(zoom * 100) + '%';
        setTimeout(updateConnections, 100);
    }

    document.getElementById('zoomInBtn').addEventListener('click', () => {
        if (zoom < 1.5) { zoom += 0.1; applyZoom(); }
    });
    document.getElementById('zoomOutBtn').addEventListener('click', () => {
        if (zoom > 0.2) { zoom -= 0.1; applyZoom(); }
    });
    document.getElementById('zoomResetBtn').addEventListener('click', () => {
        zoom = 0.55; applyZoom();
    });
    document.getElementById('resetViewBtn').addEventListener('click', () => {
        document.getElementById('canvasContainer').scrollTo({ top: 0, behavior: 'smooth' });
    });

    window.addEventListener('resize', updateConnections);
    document.getElementById('canvasContainer').addEventListener('scroll', updateConnections);

    renderDiagram();
    setTimeout(() => updateConnections(), 300);
</script>
</body>
</html>
