<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SIGPAZ - Diagrama de Clases UML (Completo - Todas las tablas)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: #0f0f1a;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .toolbar {
            background: #1a1b2a;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2b3a;
            z-index: 20;
        }
        .title {
            color: #cbd5ff;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .title span {
            background: #10b981;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.8);}
            100% { opacity: 1; transform: scale(1.2);}
        }
        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        button {
            background: #2d2e3a;
            border: none;
            color: #e2e2f0;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        button:hover {
            background: #4a4b5e;
            transform: translateY(-1px);
        }
        button.primary {
            background: #10b981;
            color: white;
            box-shadow: 0 2px 6px rgba(16,185,129,0.3);
        }
        button.primary:hover {
            background: #059669;
        }
        /* Sidebar ocultable */
        .sidebar {
            position: fixed;
            top: 55px;
            left: 0;
            bottom: 12px;
            width: 260px;
            background: #14151fcc;
            backdrop-filter: blur(12px);
            border-radius: 0 16px 16px 0;
            border: 1px solid #2a2b3a;
            border-left: none;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 30;
            transition: transform 0.2s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .sidebar.hidden {
            transform: translateX(-100%);
        }
        .search-box {
            background: #0f0f1a;
            border-radius: 40px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #2a2b3a;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: #f0f0fa;
            width: 100%;
            outline: none;
            font-size: 0.7rem;
        }
        .table-list {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .table-list::-webkit-scrollbar {
            width: 6px;
        }
        .table-list::-webkit-scrollbar-track {
            background: #0f0f1a;
            border-radius: 10px;
        }
        .table-list::-webkit-scrollbar-thumb {
            background: #10b981;
            border-radius: 10px;
        }
        .table-item {
            background: #1e1f2c;
            padding: 6px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.7rem;
            font-weight: 500;
            color: #cbd5ff;
            border-left: 2px solid #10b981;
        }
        .table-item:hover {
            background: #2d2e3a;
            transform: translateX(4px);
        }
        .table-item.selected {
            background: #2d3a4a;
            border-left: 2px solid #facc15;
            color: white;
        }
        /* Lienzo con ajuste dinámico */
        .canvas-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 48px);
            overflow: auto;
            background: radial-gradient(circle at 20% 30%, #14151f, #0a0a12);
            transition: margin-left 0.2s ease;
        }
        .canvas-container.sidebar-visible {
            margin-left: 260px;
            width: calc(100% - 260px);
        }
        .canvas-inner {
            position: relative;
            width: 14000px;
            height: 12000px;
            background: transparent;
        }
        /* Paquetes estáticos (azules) */
        .static-package {
            position: absolute;
            border: 2px solid #3a4b6a;
            border-radius: 16px;
            background: rgba(58,75,106,0.1);
            backdrop-filter: blur(4px);
            pointer-events: none;
        }
        .package-title {
            position: absolute;
            top: -12px;
            left: 20px;
            background: #2a3a4a;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            color: #a5f3c3;
            white-space: nowrap;
        }
        /* Cajuelas amarillas por nivel (destacadas) */
        .level-package {
            position: absolute;
            border: 3px solid #facc15;
            border-radius: 20px;
            background: rgba(250,204,21,0.08);
            backdrop-filter: blur(4px);
            pointer-events: none;
            box-shadow: 0 0 20px rgba(250,204,21,0.4);
        }
        .level-title {
            position: absolute;
            top: -18px;
            left: 20px;
            background: #facc15;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            color: #1a1b2a;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 6;
        }
        /* Tarjeta de clase UML */
        .class-card {
            position: absolute;
            background: #1a1b2a;
            border-radius: 8px;
            width: 420px;
            backdrop-filter: blur(2px);
            border: 1px solid #3a3b4a;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            cursor: grab;
            transition: box-shadow 0.2s, border 0.1s;
            z-index: 5;
            display: flex;
            flex-direction: column;
            font-size: 11px;
            color: #e0e0f0;
        }
        .class-card:active {
            cursor: grabbing;
        }
        .class-card.selected {
            border: 2px solid #10b981;
            box-shadow: 0 0 0 3px rgba(16,185,129,0.5), 0 0 15px rgba(16,185,129,0.6);
            animation: neonPulse 1.5s infinite alternate;
        }
        @keyframes neonPulse {
            from { box-shadow: 0 0 0 2px rgba(16,185,129,0.4), 0 0 8px rgba(16,185,129,0.5); }
            to { box-shadow: 0 0 0 4px rgba(16,185,129,0.7), 0 0 20px rgba(16,185,129,0.8); }
        }
        .class-card.highlight {
            border: 2px solid #facc15;
            box-shadow: 0 0 0 3px rgba(250,204,21,0.4);
            transition: all 0.2s;
        }
        .class-header {
            background: #0f0f1a;
            padding: 8px 8px 4px 8px;
            border-radius: 8px 8px 0 0;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #2a2b3a;
            font-size: 12px;
            color: #a5f3c3;
        }
        .stereotype {
            font-size: 9px;
            color: #9ca3af;
            font-style: italic;
            margin-top: 2px;
        }
        /* Scroll interno en atributos y métodos */
        .class-attributes, .class-methods {
            padding: 6px 8px;
            max-height: 320px;
            overflow-y: auto;
            overflow-x: auto;
        }
        .class-attributes {
            border-bottom: 1px solid #2a2b3a;
        }
        .class-attributes::-webkit-scrollbar, .class-methods::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .class-attributes::-webkit-scrollbar-track, .class-methods::-webkit-scrollbar-track {
            background: #0f0f1a;
            border-radius: 10px;
        }
        .class-attributes::-webkit-scrollbar-thumb, .class-methods::-webkit-scrollbar-thumb {
            background: #10b981;
            border-radius: 10px;
        }
        .attribute-item, .method-item {
            padding: 3px 0;
            display: flex;
            gap: 6px;
            font-family: monospace;
            font-size: 9px;
            border-bottom: 1px dotted #2a2b3a;
            cursor: pointer;
            white-space: nowrap;
        }
        .attribute-item:hover, .method-item:hover {
            background: #2a2b3a;
            border-radius: 4px;
        }
        .attr-visibility {
            width: 16px;
            color: #facc15;
        }
        .attr-name {
            flex: 1;
            color: #cbd5e6;
            overflow-x: auto;
        }
        .attr-type {
            color: #9ca3af;
            font-size: 8px;
            flex-shrink: 0;
        }
        .col-fk {
            color: #60a5fa;
            cursor: pointer;
            margin-left: 2px;
        }
        .method-name {
            color: #a5f3c3;
        }
        /* SVG de relaciones */
        .relation-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
        }
        .relation-line {
            stroke-width: 1.5;
            fill: none;
        }
        .relation-multipl {
            font-size: 9px;
            fill: #a5f3c3;
            stroke: #1f2937;
            stroke-width: 2px;
            paint-order: stroke;
        }
        .relation-verb {
            font-size: 9px;
            fill: #facc15;
            stroke: #1f2937;
            stroke-width: 1.5px;
            paint-order: stroke;
            font-style: italic;
        }
        /* Scrolls del lienzo principal */
        .canvas-container::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }
        .canvas-container::-webkit-scrollbar-track {
            background: #0f0f1a;
            border-radius: 10px;
            border: 1px solid #2a2b3a;
        }
        .canvas-container::-webkit-scrollbar-thumb {
            background: #10b981;
            border-radius: 10px;
            border: 2px solid #0f0f1a;
        }
        /* Panel de detalles */
        .detail-panel {
            position: fixed;
            bottom: 12px;
            right: 12px;
            width: 380px;
            max-height: 60vh;
            overflow-y: auto;
            background: #14151fe6;
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid #3a4b6a;
            color: #f0f0fa;
            pointer-events: auto;
            z-index: 40;
            font-size: 11px;
        }
        .detail-panel h4 {
            margin-bottom: 6px;
            color: #10b981;
            font-size: 12px;
        }
        .detail-panel .note {
            background: #2a2b3a;
            padding: 6px;
            border-radius: 8px;
            margin-top: 8px;
            font-style: italic;
            border-left: 3px solid #10b981;
        }
        .close-panel {
            float: right;
            background: none;
            padding: 0;
            font-size: 16px;
            color: #ccc;
            cursor: pointer;
        }
        .status {
            position: fixed;
            bottom: 8px;
            left: 270px;
            background: #000000aa;
            padding: 2px 8px;
            border-radius: 16px;
            font-size: 9px;
            color: #ccc;
            z-index: 25;
            transition: left 0.2s;
        }
        .status.sidebar-hidden {
            left: 12px;
        }
    </style>
</head>
<body>
<div class="toolbar">
    <div class="title"><span></span> SIGPAZ - DIAGRAMA DE CLASES UML (TODAS LAS TABLAS COMPLETAS)</div>
    <div class="controls">
        <button id="arrangeLevelBtn" class="primary">📊 NIVELES</button>
        <button id="arrangeGridBtn" class="primary">📐 CUADRÍCULA</button>
        <button id="resetViewBtn" class="primary">⟳ CENTRAR</button>
        <button id="toggleSidebarBtn">📋</button>
    </div>
</div>
<div class="sidebar" id="sidebar">
    <div class="search-box">🔍 <input type="text" id="searchTables" placeholder="Buscar clase..."></div>
    <div class="table-list" id="tableList"></div>
</div>
<div class="canvas-container" id="canvasContainer">
    <div class="canvas-inner" id="canvasInner">
        <svg class="relation-svg" id="relationSvg"></svg>
        <div id="diagramCanvas"></div>
    </div>
</div>
<div class="detail-panel" id="detailPanel" style="display: none;">
    <button class="close-panel" id="closeDetailBtn">✕</button>
    <div id="detailContent"></div>
</div>
<div class="status" id="statusMsg">🖱️ Arrastra | Doble clic | Click 🔗 navega y selecciona | Scroll interno | Niveles con cajuelas</div>

    function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
    const classesData = {};
    for (const [tableName, table] of Object.entries(tablesData)) {
        const className = capitalize(tableName);
        const attributes = table.cols.map(col => ({
            name: col.name,
            type: col.type,
            visibility: col.visibility || (col.pk ? "+" : (col.name.includes("cifrada") || col.name.includes("hash") ? "-" : "+")),
            pk: col.pk === true,
            fk: col.fk === true,
            ref: col.ref ? capitalize(col.ref) : null,
            derived: col.name.startsWith("/") || false
        }));
        const methods = [
            { name: "crear()", returnType: "boolean", visibility: "+" },
            { name: "actualizar()", returnType: "boolean", visibility: "+" },
            { name: "eliminar()", returnType: "boolean", visibility: "+" }
        ];
        classesData[className] = {
            attributes: attributes,
            methods: methods,
            pos: { x: table.x, y: table.y },
            package: table.pkg
        };
    }

    // Añadir clases base e interfaces (herencia UML)
    classesData["EntidadBase"] = {
        stereotype: "abstract",
        attributes: [
            { name: "id", type: "int", visibility: "#" },

    // Herencias y realizaciones
    const entities = ["Denuncia", "Conciliacion", "Personal", "Usuario", "Persona", "Backup", "Asistencia", "LogAuditoria", "Notificacion", "PrestamoExpediente", "Restauracion", "Sentencia", "VotoConciliacion", "MedidaCautelar", "Alerta", "Evidencias", "Remision"];
    entities.forEach(e => { if (classesData[e]) classesData[e].extends = "EntidadBase"; });
    if (classesData["Persona"]) classesData["Persona"].implements = ["IAuditable"];
    if (classesData["Usuario"]) classesData["Usuario"].implements = ["INotificable"];
    if (classesData["Denuncia"]) classesData["Denuncia"].implements = ["IExportable"];

    // Paquetes estáticos
    const packages = [];
    const pkgMap = new Map();
    for (const [name, data] of Object.entries(classesData)) {
        const pkg = data.package || "Otros";
        if (!pkgMap.has(pkg)) pkgMap.set(pkg, []);
        pkgMap.get(pkg).push(name);
    }
    for (const [pkgName, classes] of pkgMap.entries()) packages.push({ name: pkgName, classes: classes });

    // Relaciones
    const associations = [];
    const usedKeys = new Set();
    for (const [tableName, table] of Object.entries(tablesData)) {
        const fromClass = capitalize(tableName);
        for (const col of table.cols) {
            if (col.fk && col.ref) {
                const toClass = capitalize(col.ref);
                const key = `${fromClass}->${toClass}`;
                if (!usedKeys.has(key)) {
                    usedKeys.add(key);
                    associations.push({ from: fromClass, to: toClass, verb: `${associations.length+1}. referencia`, fromMultiplicity: "*", toMultiplicity: "1", type: "association" });
                }
            }
        }
    }
    for (const [name, data] of Object.entries(classesData)) {
        if (data.extends) associations.push({ from: name, to: data.extends, type: "inheritance" });
        if (data.implements) data.implements.forEach(iface => associations.push({ from: name, to: iface, type: "realization" }));
    }

    // ==================================================================
    // FUNCIONES DE RENDERIZADO Y ORDENAMIENTO
    // ==================================================================
    function drawStaticPackages() {
        const container = document.getElementById('diagramCanvas');
        document.querySelectorAll('.static-package').forEach(p => p.remove());
        for (const pkg of packages) {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            let found = false;
            for (const clsName of pkg.classes) {
                const card = document.getElementById(`class-${clsName}`);
                if (card) {
                    found = true;
                    const left = parseFloat(card.style.left);
                    const top = parseFloat(card.style.top);
                    minX = Math.min(minX, left);
                    minY = Math.min(minY, top);
                    maxX = Math.max(maxX, left + card.offsetWidth);
                    maxY = Math.max(maxY, top + card.offsetHeight);
                }
            }
            if (!found) continue;
            const padding = 15;
            const width = maxX - minX + 2 * padding;
            const height = maxY - minY + 2 * padding;
            const pkgDiv = document.createElement('div');
            pkgDiv.className = 'static-package';
            pkgDiv.style.left = `${minX - padding}px`;
            pkgDiv.style.top = `${minY - padding}px`;
            pkgDiv.style.width = `${width}px`;
            pkgDiv.style.height = `${height}px`;
            const title = document.createElement('div');
            title.className = 'package-title';
            title.textContent = pkg.name;
            pkgDiv.appendChild(title);
            container.appendChild(pkgDiv);
        }
    }

    function updateRelations() {
        const svgLayer = document.getElementById('relationSvg');
        svgLayer.innerHTML = '';
        const svgNS = "http://www.w3.org/2000/svg";
        const containerRect = document.getElementById('canvasInner').getBoundingClientRect();
        for (const assoc of associations) {
            const fromCard = document.getElementById(`class-${assoc.from}`);
            const toCard = document.getElementById(`class-${assoc.to}`);
            if (!fromCard || !toCard) continue;
            const fromRect = fromCard.getBoundingClientRect();
            const toRect = toCard.getBoundingClientRect();
            const fromX = fromRect.left + fromRect.width/2 - containerRect.left;
            const fromY = fromRect.top + fromRect.height/2 - containerRect.top;
            const toX = toRect.left + toRect.width/2 - containerRect.left;
            const toY = toRect.top + toRect.height/2 - containerRect.top;
            const line = document.createElementNS(svgNS, 'line');
            line.setAttribute('x1', fromX);
            line.setAttribute('y1', fromY);
            line.setAttribute('x2', toX);
            line.setAttribute('y2', toY);
            line.classList.add('relation-line');
            let strokeColor = '#34d399';
            if (assoc.type === 'inheritance') {
                strokeColor = '#facc15';
                const angle = Math.atan2(toY - fromY, toX - fromX);
                const arrowSize = 8;
                const points = `${toX},${toY} ${toX - arrowSize*Math.cos(angle - Math.PI/6)},${toY - arrowSize*Math.sin(angle - Math.PI/6)} ${toX - arrowSize*Math.cos(angle + Math.PI/6)},${toY - arrowSize*Math.sin(angle + Math.PI/6)}`;
                const polygon = document.createElementNS(svgNS, 'polygon');
                polygon.setAttribute('points', points);
                polygon.setAttribute('fill', '#facc15');
                svgLayer.appendChild(polygon);
            } else if (assoc.type === 'realization') {
                strokeColor = '#60a5fa';
                line.setAttribute('stroke-dasharray', '4,3');
                const angle = Math.atan2(toY - fromY, toX - fromX);
                const arrowSize = 8;
                const points = `${toX},${toY} ${toX - arrowSize*Math.cos(angle - Math.PI/6)},${toY - arrowSize*Math.sin(angle - Math.PI/6)} ${toX - arrowSize*Math.cos(angle + Math.PI/6)},${toY - arrowSize*Math.sin(angle + Math.PI/6)}`;
                const polygon = document.createElementNS(svgNS, 'polygon');
                polygon.setAttribute('points', points);
                polygon.setAttribute('fill', 'none');
                polygon.setAttribute('stroke', '#60a5fa');
                polygon.setAttribute('stroke-width', '1.5');
                svgLayer.appendChild(polygon);
            } else {
                strokeColor = '#34d399';
            }
            line.setAttribute('stroke', strokeColor);
            svgLayer.appendChild(line);
            if (assoc.fromMultiplicity) {
                const mult = document.createElementNS(svgNS, 'text');
                mult.setAttribute('x', fromX + (toX - fromX)*0.1);
                mult.setAttribute('y', fromY + (toY - fromY)*0.1 - 8);
                mult.setAttribute('class', 'relation-multipl');
                mult.textContent = assoc.fromMultiplicity;
                svgLayer.appendChild(mult);
            }
            if (assoc.toMultiplicity) {
                const mult = document.createElementNS(svgNS, 'text');
                mult.setAttribute('x', toX + (fromX - toX)*0.1);
                mult.setAttribute('y', toY + (fromY - toY)*0.1 - 8);
                mult.setAttribute('class', 'relation-multipl');
                mult.textContent = assoc.toMultiplicity;
                svgLayer.appendChild(mult);
            }
            if (assoc.verb) {
                const midX = (fromX + toX)/2;
                const midY = (fromY + toY)/2;
                const verbText = document.createElementNS(svgNS, 'text');
                verbText.setAttribute('x', midX);
                verbText.setAttribute('y', midY - 12);
                verbText.setAttribute('class', 'relation-verb');
                verbText.textContent = assoc.verb;
                svgLayer.appendChild(verbText);
            }
        }
    }

    // Función para seleccionar una clase (resalta borde verde y actualiza sidebar)
    function selectClass(className) {
        // Quitar selección de todas las tarjetas
        document.querySelectorAll('.class-card').forEach(c => c.classList.remove('selected'));
        // Seleccionar la nueva
        const card = document.getElementById(`class-${className}`);
        if (card) card.classList.add('selected');
        // Opcional: resaltar también en la lista lateral
        document.querySelectorAll('.table-item').forEach(item => {
            if (item.textContent === className) item.classList.add('selected');
            else item.classList.remove('selected');
        });
    }

    // Función de navegación FK mejorada: scroll, highlight temporal y selección permanente
    function navigateToForeignClass(targetClassName) {
        const targetCard = document.getElementById(`class-${targetClassName}`);
        if (targetCard) {
            // Scroll suave
            targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            // Resaltado amarillo temporal
            targetCard.classList.add('highlight');
            setTimeout(() => targetCard.classList.remove('highlight'), 1500);
            // Selección permanente (borde verde)
            selectClass(targetClassName);
        }
    }

    function renderCards() {
        const diagramCanvas = document.getElementById('diagramCanvas');
        diagramCanvas.innerHTML = '';
        for (const [name, data] of Object.entries(classesData)) {
            const card = document.createElement('div');
            card.className = 'class-card';
            card.id = `class-${name}`;
            card.style.left = `${data.pos.x}px`;
            card.style.top = `${data.pos.y}px`;
            let headerHtml = `<div class="class-header">${name}`;
            if (data.stereotype) headerHtml += `<div class="stereotype">«${data.stereotype}»</div>`;
            if (data.isAbstract) headerHtml += `<div class="stereotype">«abstract»</div>`;
            if (data.isInterface) headerHtml += `<div class="stereotype">«interface»</div>`;
            headerHtml += `</div>`;
            card.innerHTML = headerHtml;
            const attrsDiv = document.createElement('div');
            attrsDiv.className = 'class-attributes';
            (data.attributes || []).forEach(attr => {
                const row = document.createElement('div');
                row.className = 'attribute-item';
                let fkMark = '';
                let clickHandler = null;
                if (attr.fk && attr.ref) {
                    fkMark = ' 🔗';
                    clickHandler = (e) => {
                        e.stopPropagation();
                        navigateToForeignClass(attr.ref);
                    };
                }
                row.innerHTML = `
                    <span class="attr-visibility">${attr.visibility}</span>
                    <span class="attr-name">${attr.derived ? '/' : ''}${attr.name}${fkMark}</span>
                    <span class="attr-type">: ${attr.type}</span>
                `;
                if (clickHandler) {
                    row.style.cursor = 'pointer';
                    row.addEventListener('click', clickHandler);
                }
                attrsDiv.appendChild(row);
            });
            card.appendChild(attrsDiv);
            const methodsDiv = document.createElement('div');
            methodsDiv.className = 'class-methods';
            (data.methods || []).forEach(method => {
                const row = document.createElement('div');
                row.className = 'method-item';
                row.innerHTML = `<span class="attr-visibility">${method.visibility}</span><span class="method-name">${method.name}</span><span class="attr-type">: ${method.returnType}</span>`;
                methodsDiv.appendChild(row);
            });
            if (!data.methods || data.methods.length === 0) methodsDiv.innerHTML = '<div style="color:#6b7280; font-style:italic;">...</div>';
            card.appendChild(methodsDiv);
            // Arrastre
            card.addEventListener('mousedown', (e) => {
                if (e.target.closest('.attribute-item') || e.target.closest('.method-item')) return;
                dragActive = true;
                currentDragElem = card;
                startX = e.clientX;
                startY = e.clientY;
                dragOffsetX = parseFloat(card.style.left);
                dragOffsetY = parseFloat(card.style.top);
                card.style.zIndex = '100';
                e.preventDefault();
            });
            card.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                showClassDetails(name);
            });
            diagramCanvas.appendChild(card);
        }
        updateRelations();
        drawStaticPackages();
    }

    function computeLevels() {
        const graph = new Map();
        const inDegree = new Map();
        const allClasses = Object.keys(classesData);
        allClasses.forEach(c => { graph.set(c, []); inDegree.set(c, 0); });
        for (const assoc of associations) {
            if (assoc.type === 'inheritance' || assoc.type === 'realization' || assoc.type === 'association') {
                graph.get(assoc.from).push(assoc.to);
                inDegree.set(assoc.to, inDegree.get(assoc.to) + 1);
            }
        }
        const queue = [];
        const levels = new Map();
        allClasses.forEach(c => { if (inDegree.get(c) === 0) queue.push(c); });
        let currentLevel = 0;
        while (queue.length > 0) {
            const levelSize = queue.length;
            for (let i = 0; i < levelSize; i++) {
                const node = queue.shift();
                levels.set(node, currentLevel);
                for (const neighbor of graph.get(node)) {
                    inDegree.set(neighbor, inDegree.get(neighbor) - 1);
                    if (inDegree.get(neighbor) === 0) queue.push(neighbor);
                }
            }
            currentLevel++;
        }
        allClasses.forEach(c => { if (!levels.has(c)) levels.set(c, 0); });
        return levels;
    }

    function drawLevelPackages(levels) {
        document.querySelectorAll('.level-package').forEach(p => p.remove());
        const levelGroups = new Map();
        for (const [cls, level] of levels.entries()) {
            if (!levelGroups.has(level)) levelGroups.set(level, []);
            levelGroups.get(level).push(cls);
        }
        const container = document.getElementById('diagramCanvas');
        for (const [level, classes] of levelGroups.entries()) {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            for (const cls of classes) {
                const card = document.getElementById(`class-${cls}`);
                if (card) {
                    const left = parseFloat(card.style.left);
                    const top = parseFloat(card.style.top);
                    minX = Math.min(minX, left);
                    minY = Math.min(minY, top);
                    maxX = Math.max(maxX, left + card.offsetWidth);
                    maxY = Math.max(maxY, top + card.offsetHeight);
                }
            }
            if (!isFinite(minX)) continue;
            const padding = 15;
            const width = maxX - minX + 2 * padding;
            const height = maxY - minY + 2 * padding;
            const pkgDiv = document.createElement('div');
            pkgDiv.className = 'level-package';
            pkgDiv.style.left = `${minX - padding}px`;
            pkgDiv.style.top = `${minY - padding}px`;
            pkgDiv.style.width = `${width}px`;
            pkgDiv.style.height = `${height}px`;
            const title = document.createElement('div');
            title.className = 'level-title';
            title.textContent = `📊 NIVEL ${level} (${classes.length} clases)`;
            pkgDiv.appendChild(title);
            container.appendChild(pkgDiv);
        }
    }

    function arrangeByLevels() {
        const levels = computeLevels();
        const levelGroups = new Map();
        for (const [cls, level] of levels.entries()) {
            if (!levelGroups.has(level)) levelGroups.set(level, []);
            levelGroups.get(level).push(cls);
        }
        const startX = 200;
        const startY = 150;
        const colSpacing = 500;
        const rowSpacing = 500;
        const maxPerLevel = 5;
        let globalY = startY;
        const sortedLevels = Array.from(levelGroups.keys()).sort((a,b) => a - b);
        for (const level of sortedLevels) {
            const classesInLevel = levelGroups.get(level);
            for (let idx = 0; idx < classesInLevel.length; idx++) {
                const cls = classesInLevel[idx];
                const col = idx % maxPerLevel;
                const row = Math.floor(idx / maxPerLevel);
                const newX = startX + col * colSpacing;
                const newY = globalY + row * rowSpacing;
                classesData[cls].pos = { x: newX, y: newY };
                const card = document.getElementById(`class-${cls}`);
                if (card) {
                    card.style.left = `${newX}px`;
                    card.style.top = `${newY}px`;
                }
            }
            globalY += (Math.ceil(classesInLevel.length / maxPerLevel)) * rowSpacing;
        }
        updateRelations();
        drawLevelPackages(levels);
        drawStaticPackages();
        setTimeout(() => resetView(), 100);
    }

    function arrangeGrid() {
        document.querySelectorAll('.level-package').forEach(p => p.remove());
        const cols = 5;
        const startX = 200;
        const startY = 150;
        const colSpacing = 500;
        const rowSpacing = 500;
        let index = 0;
        const classNames = Object.keys(classesData);
        for (const name of classNames) {
            const col = index % cols;
            const row = Math.floor(index / cols);
            const newX = startX + col * colSpacing;
            const newY = startY + row * rowSpacing;
            classesData[name].pos = { x: newX, y: newY };
            const card = document.getElementById(`class-${name}`);
            if (card) {
                card.style.left = `${newX}px`;
                card.style.top = `${newY}px`;
            }
            index++;
        }
        updateRelations();
        drawStaticPackages();
        setTimeout(() => resetView(), 100);
    }

    let dragActive = false, currentDragElem = null, startX, startY, dragOffsetX, dragOffsetY;
    function onMouseMove(e) {
        if (!dragActive || !currentDragElem) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        let newLeft = dragOffsetX + dx;
        let newTop = dragOffsetY + dy;
        newLeft = Math.max(-400, Math.min(newLeft, 13600));
        newTop = Math.max(-400, Math.min(newTop, 11600));
        currentDragElem.style.left = `${newLeft}px`;
        currentDragElem.style.top = `${newTop}px`;
        const classId = currentDragElem.id.replace('class-', '');
        if (classesData[classId]) classesData[classId].pos = { x: newLeft, y: newTop };
        updateRelations();
        drawStaticPackages();
        if (document.querySelector('.level-package')) {
            const levels = computeLevels();
            drawLevelPackages(levels);
        }
    }
    function onMouseUp() { dragActive = false; if (currentDragElem) { currentDragElem.style.zIndex = ''; currentDragElem = null; } }

    function showClassDetails(className) {
        const cls = classesData[className];
        if (!cls) return;
        let html = `<h4>📌 ${className}</h4>`;
        if (cls.stereotype) html += `<p><em>«${cls.stereotype}»</em></p>`;
        html += `<p><strong>Atributos:</strong></p><ul>`;
        (cls.attributes || []).forEach(attr => {
            html += `<li>${attr.visibility} ${attr.derived ? '/' : ''}${attr.name} : ${attr.type}${attr.fk ? ' → ' + attr.ref : ''}${attr.pk ? ' [PK]' : ''}</li>`;
        });
        html += `</ul><p><strong>Métodos:</strong></p><ul>`;
        (cls.methods || []).forEach(m => html += `<li>${m.visibility} ${m.name} : ${m.returnType}</li>`);
        html += `</ul><p><strong>Relaciones:</strong><br>`;
        const outs = associations.filter(a => a.from === className);
        outs.forEach(a => html += `→ ${a.to} (${a.type}) ${a.fromMultiplicity ? a.fromMultiplicity : ''} → ${a.toMultiplicity ? a.toMultiplicity : ''}<br>`);
        const ins = associations.filter(a => a.to === className);
        ins.forEach(a => html += `← ${a.from} (${a.type})<br>`);
        html += `</p>`;
        document.getElementById('detailContent').innerHTML = html;
        document.getElementById('detailPanel').style.display = 'block';
    }

    function resetView() {
        const container = document.getElementById('canvasContainer');
        const containerRect = container.getBoundingClientRect();
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const [name, data] of Object.entries(classesData)) {
            const card = document.getElementById(`class-${name}`);
            if (card) {
                const left = parseFloat(card.style.left);
                const top = parseFloat(card.style.top);
                minX = Math.min(minX, left);
                minY = Math.min(minY, top);
                maxX = Math.max(maxX, left + card.offsetWidth);
                maxY = Math.max(maxY, top + card.offsetHeight);
            }
        }
        const groupWidth = maxX - minX;
        const groupHeight = maxY - minY;
        const targetScrollLeft = minX - (containerRect.width - groupWidth) / 2;
        const targetScrollTop = minY - (containerRect.height - groupHeight) / 2;
        container.scrollTo({ left: Math.max(0, targetScrollLeft), top: Math.max(0, targetScrollTop), behavior: 'smooth' });
    }

    function renderClassList(filter = "") {
        const listDiv = document.getElementById('tableList');
        listDiv.innerHTML = "";
        const filtered = Object.keys(classesData).filter(c => c.toLowerCase().includes(filter.toLowerCase()));
        filtered.forEach(cname => {
            const div = document.createElement('div');
            div.className = 'table-item';
            div.textContent = cname;
            div.onclick = () => {
                const card = document.getElementById(`class-${cname}`);
                if (card) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    selectClass(cname);
                }
            };
            listDiv.appendChild(div);
        });
    }

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const container = document.getElementById('canvasContainer');
        const status = document.getElementById('statusMsg');
        const isHidden = sidebar.classList.contains('hidden');
        if (isHidden) {
            sidebar.classList.remove('hidden');
            container.classList.add('sidebar-visible');
            status.classList.remove('sidebar-hidden');
        } else {
            sidebar.classList.add('hidden');
            container.classList.remove('sidebar-visible');
            status.classList.add('sidebar-hidden');
        }
    }

    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
    window.addEventListener('resize', () => updateRelations());
    new ResizeObserver(() => updateRelations()).observe(document.getElementById('canvasInner'));
    document.getElementById('canvasContainer').addEventListener('scroll', () => updateRelations());

    renderCards();
    renderClassList();
    document.getElementById('searchTables').addEventListener('input', (e) => renderClassList(e.target.value));
    document.getElementById('resetViewBtn').addEventListener('click', resetView);
    document.getElementById('arrangeGridBtn').addEventListener('click', arrangeGrid);
    document.getElementById('arrangeLevelBtn').addEventListener('click', arrangeByLevels);
    document.getElementById('toggleSidebarBtn').addEventListener('click', toggleSidebar);
    document.getElementById('closeDetailBtn').addEventListener('click', () => { document.getElementById('detailPanel').style.display = 'none'; });
    setTimeout(() => { resetView(); updateRelations(); }, 200);
</script>
</body>
</html>
