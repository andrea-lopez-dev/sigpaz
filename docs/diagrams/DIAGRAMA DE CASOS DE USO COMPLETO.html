<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SIGPAZ - Diagrama de Casos de Uso Completo (30 casos)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: #0f0f1a;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .toolbar {
            background: #1a1b2a;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2b3a;
            z-index: 20;
            position: relative;
            flex-wrap: wrap;
            gap: 8px;
        }
        .title {
            color: #cbd5ff;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .title span {
            background: #10b981;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.8);}
            100% { opacity: 1; transform: scale(1.2);}
        }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        button {
            background: #2d2e3a;
            border: none;
            color: #e2e2f0;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        button:hover {
            background: #4a4b5e;
            transform: translateY(-1px);
        }
        button.primary {
            background: #10b981;
            color: white;
            box-shadow: 0 2px 6px rgba(16,185,129,0.3);
        }
        button.primary:hover {
            background: #059669;
        }
        .sidebar {
            position: absolute;
            top: 70px;
            left: 16px;
            bottom: 16px;
            width: 280px;
            background: #14151fcc;
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid #2a2b3a;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 30;
            pointer-events: auto;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .search-box {
            background: #0f0f1a;
            border-radius: 40px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #2a2b3a;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: #f0f0fa;
            width: 100%;
            outline: none;
            font-size: 0.9rem;
        }
        .element-list {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .element-list::-webkit-scrollbar { width: 8px; }
        .element-list::-webkit-scrollbar-track { background: #0f0f1a; border-radius: 10px; }
        .element-list::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
        .list-item {
            background: #1e1f2c;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
            font-weight: 500;
            color: #cbd5ff;
            border-left: 3px solid #10b981;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .list-item:hover { background: #2d2e3a; transform: translateX(4px); }
        .canvas-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 60px);
            overflow: auto;
            background: radial-gradient(circle at 20% 30%, #14151f, #0a0a12);
        }
        .canvas-inner {
            position: relative;
            width: 10000px;
            height: 10000px;
            background: transparent;
        }
        .actor-card {
            position: absolute;
            background: #1e2a3a;
            border-radius: 60px;
            border: 2px solid #facc15;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            cursor: grab;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            min-width: 130px;
            transition: 0.1s;
        }
        .actor-card:active { cursor: grabbing; }
        .actor-icon { font-size: 2.5rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .actor-name { font-weight: bold; font-size: 13px; margin-top: 6px; color: #facc15; text-align: center; }
        .usecase-card {
            position: absolute;
            background: #2a1e2a;
            border: 2px solid #a78bfa;
            border-radius: 60px / 40px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            cursor: grab;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 14px 24px;
            min-width: 200px;
            max-width: 300px;
            min-height: 70px;
            font-size: 12px;
            font-weight: 500;
            color: #e0e0f0;
            transition: 0.1s;
            word-break: break-word;
            gap: 6px;
        }
        .uc-prefix {
            font-weight: bold;
            color: #facc15;
            background: #1a1a2a;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            display: inline-block;
            margin-right: 6px;
        }
        .usecase-card:active { cursor: grabbing; }
        .usecase-card.selected, .actor-card.selected {
            border: 2px solid #10b981;
            box-shadow: 0 0 0 3px rgba(16,185,129,0.5), 0 0 15px rgba(16,185,129,0.6);
            animation: neonPulse 1.5s infinite alternate;
        }
        @keyframes neonPulse {
            from { box-shadow: 0 0 0 3px rgba(16,185,129,0.4), 0 0 10px rgba(16,185,129,0.5); }
            to { box-shadow: 0 0 0 4px rgba(16,185,129,0.7), 0 0 20px rgba(16,185,129,0.8); }
        }
        .highlight { border: 2px solid #facc15 !important; box-shadow: 0 0 0 3px rgba(250,204,21,0.4); }
        .relation-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
        }
        .assoc-line { stroke: #34d399; stroke-width: 2; fill: none; }
        .include-line { stroke: #a78bfa; stroke-width: 2; stroke-dasharray: 8 4; fill: none; }
        .extend-line { stroke: #facc15; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
        .stereotype-text {
            font-size: 9px;
            fill: #facc15;
            font-style: italic;
            paint-order: stroke;
            stroke: #0f0f1a;
            stroke-width: 1px;
        }
        .detail-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 450px;
            max-height: 80vh;
            overflow-y: auto;
            background: #14151fe6;
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #3a4b6a;
            color: #f0f0fa;
            pointer-events: auto;
            z-index: 40;
            font-size: 12px;
        }
        .detail-panel h4 { margin-bottom: 8px; color: #10b981; }
        .permiso-tabla {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 11px;
        }
        .permiso-tabla th, .permiso-tabla td {
            border: 1px solid #2a3a4a;
            padding: 6px;
            text-align: center;
        }
        .permiso-tabla th { background: #0a0a12; color: #a5f3c3; }
        .close-panel {
            float: right;
            background: none;
            padding: 0;
            font-size: 18px;
            color: #ccc;
            cursor: pointer;
        }
        .status {
            position: fixed;
            bottom: 28px;
            left: 20px;
            background: #0f0f1ae6;
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            color: #cbd5e6;
            z-index: 45;
            pointer-events: none;
            border: 1px solid #2a4b3a;
            font-family: monospace;
            white-space: nowrap;
        }
        .legend {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0f0f1acc;
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 10px;
            color: #bbb;
            z-index: 45;
            border: 1px solid #2a3a4a;
            pointer-events: none;
        }
        .canvas-container::-webkit-scrollbar { width: 14px; height: 14px; }
        .canvas-container::-webkit-scrollbar-track { background: #0f0f1a; border-radius: 10px; border: 1px solid #2a2b3a; }
        .canvas-container::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; border: 2px solid #0f0f1a; }
        @media (max-width: 700px) {
            .status { font-size: 10px; padding: 5px 12px; white-space: normal; bottom: 16px; left: 12px; max-width: 85%; }
            .usecase-card { min-width: 160px; font-size: 10px; flex-direction: column; }
            .actor-card { min-width: 100px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .controls { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="toolbar">
    <div class="title"><span></span> SIGPAZ · CASOS DE USO COMPLETO (30 casos - C1 al C30)</div>
    <div class="controls">
        <button id="arrangeTopologicalBtn" class="primary">Niveles topológico</button>
        <button id="arrangeByIdBtn" class="primary">Orden por ID (C1→C30)</button>
        <button id="arrangeByActorBtn" class="primary">Orden por actor</button>
        <button id="resetViewBtn" class="primary">Centrar todo</button>
        <button id="toggleSidebarBtn">Ocultar lista</button>
    </div>
</div>
<div class="sidebar" id="sidebar">
    <div class="search-box">🔍 <input type="text" id="searchElement" placeholder="Buscar actor / caso..."></div>
    <div class="element-list" id="elementList"></div>
</div>
<div class="canvas-container" id="canvasContainer">
    <div class="canvas-inner" id="canvasInner">
        <svg class="relation-svg" id="relationSvg"></svg>
        <div id="diagramCanvas"></div>
    </div>
</div>
<div class="detail-panel" id="detailPanel" style="display: none;">
    <button class="close-panel" id="closeDetailBtn">✕</button>
    <div id="detailContent"></div>
</div>
<div class="status">🖱️ Arrastra | 🔗 Doble clic: explicación completa | 30 casos de uso</div>
<div class="legend">▬ verde: Asociación &nbsp; ▬▬ morado: include &nbsp; ▬▬ amarillo: extend</div>

<script>
    // --------------------------------------------------------------
    // MODELO COMPLETO DE CASOS DE USO SIGPAZ - 30 casos (C1 a C30)
    // Incluye todos los módulos solicitados y adicionales de justicia comunal
    // --------------------------------------------------------------
    const actors = [
        { name: "Juez de Paz (Administrador)", icon: "👨‍⚖️", pos: { x: 180, y: 200 } },
        { name: "Secretario", icon: "📋", pos: { x: 180, y: 550 } },
        { name: "Alguacil", icon: "🚔", pos: { x: 180, y: 900 } },
        { name: "Ciudadano", icon: "👤", pos: { x: 180, y: 1250 } }
    ];
    
    const useCasesRaw = [
        // Módulo de Autenticación y Seguridad (C1-C3)
        { id: "UC1", name: "Autenticarse (MFA)", displayNumber: "C1", desc: "El usuario inicia sesión con credenciales y segundo factor.", include: ["UC2","UC3"], extend: [], pos: { x: 650, y: 80 } },
        { id: "UC2", name: "Verificar MFA", displayNumber: "C2", desc: "Verificación del código de autenticación de dos factores.", include: [], extend: [], pos: { x: 1000, y: 80 } },
        { id: "UC3", name: "Solicitar Código OTP", displayNumber: "C3", desc: "Solicitar código de un solo uso (exclusivo Juez).", include: [], extend: [], pos: { x: 1350, y: 80 } },
        
        // Denuncias (C4-C7)
        { id: "UC4", name: "Presentar Denuncia", displayNumber: "C4", desc: "Ciudadano o funcionario presenta una denuncia.", include: [], extend: [], pos: { x: 650, y: 220 } },
        { id: "UC5", name: "Registrar Denuncia", displayNumber: "C5", desc: "Registro formal de la denuncia, incluye presentación.", include: ["UC4"], extend: [], pos: { x: 1000, y: 220 } },
        { id: "UC6", name: "Consultar Estado Denuncia", displayNumber: "C6", desc: "Consulta del estado actual de una denuncia.", include: [], extend: [], pos: { x: 650, y: 350 } },
        { id: "UC7", name: "Derivar Caso a Conciliación", displayNumber: "C7", desc: "Derivar una denuncia al módulo de conciliación.", include: ["UC5"], extend: [], pos: { x: 1000, y: 350 } },
        
        // Conciliaciones y Audiencias (C8-C12)
        { id: "UC8", name: "Programar Audiencia", displayNumber: "C8", desc: "Agendar audiencia de conciliación, verifica disponibilidad.", include: ["UC12"], extend: [], pos: { x: 650, y: 490 } },
        { id: "UC9", name: "Asistir a Audiencia", displayNumber: "C9", desc: "Participantes asisten a la audiencia.", include: ["UC10"], extend: [], pos: { x: 1000, y: 490 } },
        { id: "UC10", name: "Registrar Asistencia", displayNumber: "C10", desc: "Registrar quiénes asistieron a la audiencia.", include: [], extend: [], pos: { x: 1350, y: 490 } },
        { id: "UC11", name: "Registrar Acta de Conciliación", displayNumber: "C11", desc: "Levantar el acta oficial del acuerdo alcanzado.", include: [], extend: [], pos: { x: 650, y: 620 } },
        { id: "UC12", name: "Verificar Disponibilidad", displayNumber: "C12", desc: "Verificar recursos y participantes antes de programar.", include: [], extend: [], pos: { x: 1350, y: 380 } },
        
        // Expedientes (C13-C14)
        { id: "UC13", name: "Solicitar Préstamo Expediente", displayNumber: "C13", desc: "Funcionario solicita préstamo de expediente.", include: [], extend: [], pos: { x: 650, y: 760 } },
        { id: "UC14", name: "Registrar Devolución", displayNumber: "C14", desc: "Devolución del expediente prestado.", include: [], extend: [], pos: { x: 1000, y: 760 } },
        
        // Notificaciones (C15-C16)
        { id: "UC15", name: "Gestionar Notificaciones", displayNumber: "C15", desc: "Crear y gestionar notificaciones a las partes.", include: ["UC16"], extend: [], pos: { x: 650, y: 900 } },
        { id: "UC16", name: "Enviar Notificación", displayNumber: "C16", desc: "Envío efectivo de la notificación.", include: [], extend: [], pos: { x: 1000, y: 900 } },
        
        // Administración y Configuración (C17-C21)
        { id: "UC17", name: "Gestionar Funcionarios", displayNumber: "C17", desc: "ALTA, BAJA y modificación de funcionarios.", include: [], extend: [], pos: { x: 650, y: 1050 } },
        { id: "UC18", name: "Gestionar Usuarios y Roles", displayNumber: "C18", desc: "Administración de usuarios del sistema y sus roles.", include: [], extend: [], pos: { x: 1000, y: 1050 } },
        { id: "UC19", name: "Generar Reportes", displayNumber: "C19", desc: "Reportes estadísticos y de gestión.", include: [], extend: [], pos: { x: 650, y: 1200 } },
        { id: "UC20", name: "Ejecutar Backups", displayNumber: "C20", desc: "Copias de seguridad. Extiende reportes.", include: [], extend: ["UC19"], pos: { x: 1000, y: 1200 } },
        { id: "UC21", name: "Auditoría de Sistema", displayNumber: "C21", desc: "Logs y trazabilidad de acciones (exclusivo Juez).", include: [], extend: [], pos: { x: 1350, y: 1050 } },
        
        // Gestión de Personal, Asistencias y Horarios (C22-C24)
        { id: "UC22", name: "Registrar Personal", displayNumber: "C22", desc: "Alta de personal en el sistema (solo Juez).", include: [], extend: [], pos: { x: 650, y: 1360 } },
        { id: "UC23", name: "Control de Asistencias", displayNumber: "C23", desc: "Registro de entrada/salida del personal.", include: [], extend: [], pos: { x: 1000, y: 1360 } },
        { id: "UC24", name: "Gestión de Horarios", displayNumber: "C24", desc: "Definición de horarios laborales.", include: [], extend: [], pos: { x: 1350, y: 1360 } },
        
        // Remisiones Externas (C25-C26)
        { id: "UC25", name: "Remitir a Institución Externa", displayNumber: "C25", desc: "Enviar caso a otra institución.", include: ["UC26"], extend: [], pos: { x: 650, y: 1520 } },
        { id: "UC26", name: "Registrar Remisión", displayNumber: "C26", desc: "Documentar la remisión con oficio y fecha.", include: [], extend: [], pos: { x: 1000, y: 1520 } },
        
        // Catálogos y Tipos (C27-C28)
        { id: "UC27", name: "Gestionar Tipos de Conflicto", displayNumber: "C27", desc: "Mantenimiento de los tipos de conflicto.", include: [], extend: [], pos: { x: 650, y: 1680 } },
        { id: "UC28", name: "Administrar Medidas Cautelares", displayNumber: "C28", desc: "Gestión de medidas cautelares posibles.", include: [], extend: [], pos: { x: 1000, y: 1680 } },
        
        // Seguimiento de Acuerdos y Certificados (C29-C30)
        { id: "UC29", name: "Gestionar Seguimiento de Acuerdos", displayNumber: "C29", desc: "Verificar cumplimiento de lo pactado en conciliación.", include: [], extend: [], pos: { x: 650, y: 1840 } },
        { id: "UC30", name: "Emitir Certificados y Constancias", displayNumber: "C30", desc: "Generar certificados para las partes.", include: [], extend: [], pos: { x: 1000, y: 1840 } }
    ];
    
    let useCasesData = [...useCasesRaw];
    
    // Asociaciones (Juez tiene todos; Secretario y Alguacil según permisos)
    const actorAssociations = [];
    useCasesData.forEach(uc => actorAssociations.push({ actor: "Juez de Paz (Administrador)", ucId: uc.id }));
    
    const secretarioExcluye = ["UC3","UC21","UC22","UC23","UC24","UC27","UC28","UC29","UC30"]; // excluye OTP, auditoría, personal, catálogos, seguimiento
    const secretarioUCs = useCasesData.filter(uc => !secretarioExcluye.includes(uc.id)).map(uc => uc.id);
    secretarioUCs.forEach(ucid => actorAssociations.push({ actor: "Secretario", ucId: ucid }));
    
    const alguacilUCs = ["UC8","UC9","UC10","UC12","UC15","UC16"];
    alguacilUCs.forEach(ucid => actorAssociations.push({ actor: "Alguacil", ucId: ucid }));
    
    actorAssociations.push({ actor: "Ciudadano", ucId: "UC4" }, { actor: "Ciudadano", ucId: "UC6" });
    
    // Dependencias include/extend
    const dependencies = [
        { from: "UC1", to: "UC2", type: "include", label: "<<include>>" },
        { from: "UC1", to: "UC3", type: "include", label: "<<include>>" },
        { from: "UC5", to: "UC4", type: "include", label: "<<include>>" },
        { from: "UC7", to: "UC5", type: "include", label: "<<include>>" },
        { from: "UC8", to: "UC12", type: "include", label: "<<include>>" },
        { from: "UC9", to: "UC10", type: "include", label: "<<include>>" },
        { from: "UC15", to: "UC16", type: "include", label: "<<include>>" },
        { from: "UC20", to: "UC19", type: "extend", label: "<<extend>>" },
        { from: "UC25", to: "UC26", type: "include", label: "<<include>>" }
    ];
    
    let actorsData = [...actors];
    
    // Funciones auxiliares
    function getActorElementId(actorName) { return `actor-${actorName.replace(/\s/g, '')}`; }
    function getUseCaseElementId(ucId) { return `uc-${ucId}`; }
    
    function renderElementList(filter = "") {
        const container = document.getElementById('elementList');
        container.innerHTML = "";
        const all = [...actorsData.map(a => ({ name: a.name, kind: "actor" })), ...useCasesData.map(uc => ({ name: `${uc.displayNumber}: ${uc.name}`, kind: "usecase", id: uc.id }))];
        const filtered = all.filter(e => e.name.toLowerCase().includes(filter.toLowerCase()));
        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<span>${item.kind === 'actor' ? (actorsData.find(a=>a.name===item.name)?.icon || '👤') : '⚪'}</span> ${item.name}`;
            div.onclick = () => {
                const id = item.kind === 'actor' ? getActorElementId(item.name) : getUseCaseElementId(item.id);
                const card = document.getElementById(id);
                if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); selectElement(id); }
            };
            container.appendChild(div);
        });
    }
    
    function selectElement(elementId) {
        document.querySelectorAll('.actor-card, .usecase-card').forEach(el => el.classList.remove('selected'));
        const card = document.getElementById(elementId);
        if (card) card.classList.add('selected');
    }
    
    // Arrastre
    let dragActive = false, currentDragElem = null, dragStartX, dragStartY, dragOffsetLeft, dragOffsetTop, dragTargetData;
    function makeDraggable(element, data, type) {
        element.addEventListener('mousedown', (e) => {
            if (e.target.closest('.detail-panel')) return;
            dragActive = true;
            currentDragElem = element;
            dragTargetData = { data, type };
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            dragOffsetLeft = parseFloat(element.style.left);
            dragOffsetTop = parseFloat(element.style.top);
            element.style.zIndex = '100';
            e.preventDefault();
        });
    }
    function onMouseMove(e) {
        if (!dragActive || !currentDragElem) return;
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        let newLeft = dragOffsetLeft + dx;
        let newTop = dragOffsetTop + dy;
        newLeft = Math.max(-300, Math.min(newLeft, 9500));
        newTop = Math.max(-300, Math.min(newTop, 9500));
        currentDragElem.style.left = `${newLeft}px`;
        currentDragElem.style.top = `${newTop}px`;
        if (dragTargetData.type === 'actor') {
            dragTargetData.data.pos = { x: newLeft, y: newTop };
        } else {
            dragTargetData.data.pos = { x: newLeft, y: newTop };
        }
        updateAllRelations();
    }
    function onMouseUp() { dragActive = false; if(currentDragElem) currentDragElem.style.zIndex = ''; currentDragElem = null; dragTargetData = null; }
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
    
    function renderDiagram() {
        const canvas = document.getElementById('diagramCanvas');
        canvas.innerHTML = '';
        actorsData.forEach(actor => {
            const div = document.createElement('div');
            div.className = 'actor-card';
            div.id = getActorElementId(actor.name);
            div.style.left = `${actor.pos.x}px`;
            div.style.top = `${actor.pos.y}px`;
            div.innerHTML = `<div class="actor-icon">${actor.icon}</div><div class="actor-name">${actor.name}</div>`;
            makeDraggable(div, actor, 'actor');
            div.addEventListener('dblclick', () => showDetails(actor.name));
            canvas.appendChild(div);
        });
        useCasesData.forEach(uc => {
            const div = document.createElement('div');
            div.className = 'usecase-card';
            div.id = getUseCaseElementId(uc.id);
            div.style.left = `${uc.pos.x}px`;
            div.style.top = `${uc.pos.y}px`;
            div.innerHTML = `<span class="uc-prefix">${uc.displayNumber}</span> ${uc.name}`;
            makeDraggable(div, uc, 'usecase');
            div.addEventListener('dblclick', () => showDetails(uc.name));
            canvas.appendChild(div);
        });
        updateAllRelations();
    }
    
    function updateAllRelations() {
        const svg = document.getElementById('relationSvg');
        svg.innerHTML = '';
        const svgNS = "http://www.w3.org/2000/svg";
        const containerRect = document.getElementById('canvasInner').getBoundingClientRect();
        for (let assoc of actorAssociations) {
            const actorEl = document.getElementById(getActorElementId(assoc.actor));
            const ucEl = document.getElementById(getUseCaseElementId(assoc.ucId));
            if (!actorEl || !ucEl) continue;
            const fromRect = actorEl.getBoundingClientRect();
            const toRect = ucEl.getBoundingClientRect();
            const fromX = fromRect.left + fromRect.width/2 - containerRect.left;
            const fromY = fromRect.top + fromRect.height/2 - containerRect.top;
            const toX = toRect.left + toRect.width/2 - containerRect.left;
            const toY = toRect.top + toRect.height/2 - containerRect.top;
            const line = document.createElementNS(svgNS, 'line');
            line.setAttribute('x1', fromX);
            line.setAttribute('y1', fromY);
            line.setAttribute('x2', toX);
            line.setAttribute('y2', toY);
            line.classList.add('assoc-line');
            svg.appendChild(line);
        }
        for (let dep of dependencies) {
            const fromEl = document.getElementById(getUseCaseElementId(dep.from));
            const toEl = document.getElementById(getUseCaseElementId(dep.to));
            if (!fromEl || !toEl) continue;
            const fromRect = fromEl.getBoundingClientRect();
            const toRect = toEl.getBoundingClientRect();
            const fromX = fromRect.left + fromRect.width/2 - containerRect.left;
            const fromY = fromRect.top + fromRect.height/2 - containerRect.top;
            const toX = toRect.left + toRect.width/2 - containerRect.left;
            const toY = toRect.top + toRect.height/2 - containerRect.top;
            const line = document.createElementNS(svgNS, 'line');
            line.setAttribute('x1', fromX);
            line.setAttribute('y1', fromY);
            line.setAttribute('x2', toX);
            line.setAttribute('y2', toY);
            if (dep.type === 'include') line.classList.add('include-line');
            else line.classList.add('extend-line');
            svg.appendChild(line);
            const midX = (fromX + toX)/2;
            const midY = (fromY + toY)/2 - 8;
            const text = document.createElementNS(svgNS, 'text');
            text.setAttribute('x', midX);
            text.setAttribute('y', midY);
            text.textContent = dep.label;
            text.classList.add('stereotype-text');
            svg.appendChild(text);
        }
    }
    
    function showDetails(elementName) {
        const actor = actorsData.find(a => a.name === elementName);
        const uc = useCasesData.find(u => u.name === elementName);
        let html = `<h4>📌 ${elementName}</h4>`;
        if (actor) {
            html += `<p><strong>Rol:</strong> ${actor.name}</p><p><strong>Permisos en SIGPAZ:</strong></p>`;
            if (actor.name === "Juez de Paz (Administrador)") html += `<p>✅ Acceso TOTAL a todos los 30 casos de uso, incluyendo auditoría, personal, catálogos y seguimiento de acuerdos.</p>`;
            else if (actor.name === "Secretario") html += `<p>📄 Acceso a denuncias, expedientes, conciliaciones, reportes, notificaciones, remisiones. Sin acceso a OTP, auditoría, gestión de personal/horarios, catálogos ni seguimiento de acuerdos.</p>`;
            else if (actor.name === "Alguacil") html += `<p>🚔 Acceso a programación de audiencias, registro de asistencia, verificación de disponibilidad y gestión de notificaciones.</p>`;
            else if (actor.name === "Ciudadano") html += `<p>👤 Acceso a presentar denuncia (C4) y consultar estado (C6).</p>`;
        } else if (uc) {
            html += `<p><strong>Caso de uso:</strong> ${uc.displayNumber} - ${uc.name}</p>`;
            html += `<p><strong>📖 Explicación detallada:</strong> ${uc.desc}</p>`;
            const incs = dependencies.filter(d => d.from === uc.id && d.type === 'include');
            const exts = dependencies.filter(d => d.from === uc.id && d.type === 'extend');
            if (incs.length) html += `<p>🔗 Include: ${incs.map(i=>i.to).join(', ')}</p>`;
            if (exts.length) html += `<p>🧩 Extend: ${exts.map(e=>e.to).join(', ')}</p>`;
            const actoresQueAcceden = actorAssociations.filter(a => a.ucId === uc.id).map(a => a.actor);
            html += `<p><strong>Actores autorizados:</strong> ${actoresQueAcceden.join(', ') || 'Ninguno'}</p>`;
            if (uc.id === "UC3" || uc.id === "UC21" || uc.id === "UC22" || uc.id === "UC24" || uc.id === "UC27" || uc.id === "UC28" || uc.id === "UC29" || uc.id === "UC30") {
                html += `<p style="color:#facc15;">🔐 Este caso de uso es exclusivo del Juez de Paz (Administrador).</p>`;
            }
        }
        html += `<hr><table class="permiso-tabla">
                  <tr><th>Rol</th><th>Denuncias</th><th>Conciliaciones</th><th>Notificaciones</th><th>Admin/Reportes</th><th>Personal/Horarios</th><th>Auditoría</th><th>Catálogos/Seguim.</th></tr>
                  <tr><td>Juez (Admin)</td><td>✅</td><td>✅</td><td>✅</td><td>✅</td><td>✅</td><td>✅</td><td>✅</td></tr>
                  <tr><td>Secretario</td><td>✅</td><td>✅</td><td>✅</td><td>✅(reportes)</td><td>❌</td><td>❌</td><td>❌</td></tr>
                  <tr><td>Alguacil</td><td>❌</td><td>✅</td><td>✅</td><td>❌</td><td>❌</td><td>❌</td><td>❌</td></tr>
                  <tr><td>Ciudadano</td><td>🔹(parcial)</td><td>❌</td><td>❌</td><td>❌</td><td>❌</td><td>❌</td><td>❌</td></tr>
                 </table>`;
        document.getElementById('detailContent').innerHTML = html;
        document.getElementById('detailPanel').style.display = 'block';
    }
    
    // Ordenamientos
    function computeTopologicalLevels() {
        const graph = new Map();
        const inDegree = new Map();
        const allUCs = useCasesData.map(uc => uc.id);
        allUCs.forEach(id => { graph.set(id, []); inDegree.set(id, 0); });
        dependencies.forEach(dep => {
            graph.get(dep.from).push(dep.to);
            inDegree.set(dep.to, inDegree.get(dep.to) + 1);
        });
        const queue = [];
        allUCs.forEach(id => { if (inDegree.get(id) === 0) queue.push(id); });
        const level = new Map();
        let currentLevel = 0;
        while (queue.length > 0) {
            let size = queue.length;
            for (let i = 0; i < size; i++) {
                const node = queue.shift();
                level.set(node, currentLevel);
                for (const neighbor of graph.get(node)) {
                    inDegree.set(neighbor, inDegree.get(neighbor) - 1);
                    if (inDegree.get(neighbor) === 0) queue.push(neighbor);
                }
            }
            currentLevel++;
        }
        allUCs.forEach(id => { if (!level.has(id)) level.set(id, 0); });
        return level;
    }
    
    function arrangeByTopological() {
        const levels = computeTopologicalLevels();
        const levelGroups = new Map();
        for (let uc of useCasesData) {
            const lvl = levels.get(uc.id) || 0;
            if (!levelGroups.has(lvl)) levelGroups.set(lvl, []);
            levelGroups.get(lvl).push(uc);
        }
        const startX = 550, startY = 150, colSpacing = 400, rowSpacing = 200;
        let globalY = startY;
        for (let lvl = 0; lvl < levelGroups.size; lvl++) {
            const ucs = levelGroups.get(lvl) || [];
            for (let idx = 0; idx < ucs.length; idx++) {
                const col = idx % 4;
                const row = Math.floor(idx / 4);
                ucs[idx].pos = { x: startX + col * colSpacing, y: globalY + row * rowSpacing };
            }
            globalY += (Math.ceil(ucs.length / 4)) * rowSpacing;
        }
        actorsData.forEach((a, i) => { a.pos = { x: 180, y: 200 + i * 280 }; });
        renderDiagram();
        setTimeout(() => resetView(), 50);
    }
    
    function arrangeById() {
        useCasesData.sort((a,b) => {
            const numA = parseInt(a.displayNumber.substring(1));
            const numB = parseInt(b.displayNumber.substring(1));
            return numA - numB;
        });
        const startX = 550, startY = 150, colSpacing = 400, rowSpacing = 200;
        useCasesData.forEach((uc, idx) => {
            const col = idx % 4;
            const row = Math.floor(idx / 4);
            uc.pos = { x: startX + col * colSpacing, y: startY + row * rowSpacing };
        });
        actorsData.forEach((a, i) => { a.pos = { x: 180, y: 200 + i * 280 }; });
        renderDiagram();
        setTimeout(() => resetView(), 50);
    }
    
    function arrangeByActor() {
        actorsData.forEach((a, i) => { a.pos = { x: 180, y: 200 + i * 280 }; });
        const groups = {
            auth: ["UC1","UC2","UC3"],
            denuncias: ["UC4","UC5","UC6","UC7"],
            conciliaciones: ["UC8","UC9","UC10","UC11","UC12"],
            expedientes: ["UC13","UC14"],
            notificaciones: ["UC15","UC16"],
            admin_reportes: ["UC17","UC18","UC19","UC20","UC21"],
            personal_asistencia: ["UC22","UC23","UC24"],
            remisiones: ["UC25","UC26"],
            catalogos: ["UC27","UC28"],
            seguimiento: ["UC29","UC30"]
        };
        let yOffset = 180;
        for (let [key, ids] of Object.entries(groups)) {
            let x = 550;
            for (let id of ids) {
                const uc = useCasesData.find(u => u.id === id);
                if (uc) uc.pos = { x: x, y: yOffset };
                x += 400;
            }
            yOffset += 150;
        }
        renderDiagram();
        setTimeout(() => resetView(), 50);
    }
    
    function resetView() {
        const container = document.getElementById('canvasContainer');
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        document.querySelectorAll('.actor-card, .usecase-card').forEach(el => {
            const left = parseFloat(el.style.left);
            const top = parseFloat(el.style.top);
            minX = Math.min(minX, left);
            minY = Math.min(minY, top);
            maxX = Math.max(maxX, left + el.offsetWidth);
            maxY = Math.max(maxY, top + el.offsetHeight);
        });
        if (minX === Infinity) return;
        const groupW = maxX - minX, groupH = maxY - minY;
        const scrollLeft = minX - (container.clientWidth - groupW) / 2;
        const scrollTop = minY - (container.clientHeight - groupH) / 2;
        container.scrollTo({ left: Math.max(0, scrollLeft), top: Math.max(0, scrollTop), behavior: 'smooth' });
    }
    
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const btn = document.getElementById('toggleSidebarBtn');
        const isVisible = sidebar.style.display !== 'none';
        sidebar.style.display = isVisible ? 'none' : 'flex';
        btn.textContent = isVisible ? 'Mostrar lista' : 'Ocultar lista';
    }
    
    // Eventos
    document.getElementById('arrangeTopologicalBtn').addEventListener('click', arrangeByTopological);
    document.getElementById('arrangeByIdBtn').addEventListener('click', arrangeById);
    document.getElementById('arrangeByActorBtn').addEventListener('click', arrangeByActor);
    document.getElementById('resetViewBtn').addEventListener('click', resetView);
    document.getElementById('toggleSidebarBtn').addEventListener('click', toggleSidebar);
    document.getElementById('closeDetailBtn').addEventListener('click', () => document.getElementById('detailPanel').style.display = 'none');
    document.getElementById('searchElement').addEventListener('input', (e) => renderElementList(e.target.value));
    
    renderElementList();
    renderDiagram();
    setTimeout(() => resetView(), 100);
    window.addEventListener('resize', () => updateAllRelations());
    document.getElementById('canvasContainer').addEventListener('scroll', () => updateAllRelations());
</script>
