        let html = `<h4>📌 ${tableName}</h4><ul>`;
        table.cols.forEach(col => {
            let badge = '';
            if (col.pk) badge = ' 🔑 PK';
            if (col.fk) {
                const rel = fkRelations.find(r => r[0] === tableName && r[1] === col.name);
                if (rel) badge += ` 🔗 FK → <span style="color:#60a5fa;cursor:pointer;text-decoration:underline;" onclick="navigateToTable('${rel[2]}')">${rel[2]}</span>`;
                else badge += ' 🔗 FK';
            }
            html += `<li><strong>${col.name}</strong> (${col.type})${badge}</li>`;
        });
        html += `</ul><p style="color:#94a3b8;font-size:10px;">Total columnas: ${table.cols.length}</p>`;
        detailContent.innerHTML = html; detailPanel.style.display = 'block';
    }

    function updateERDiagram() {
        svgLayer.innerHTML = '';
        const svgNS = "http://www.w3.org/2000/svg";
        const containerRect = canvasInner.getBoundingClientRect();

        for (const [name, data] of Object.entries(tablesData)) {
            const card = document.getElementById(`entity-${name}`);
            if (!card) continue;
            const rect = card.getBoundingClientRect();
            const cx = rect.left + rect.width/2 - containerRect.left;
            const cy = rect.top + rect.height/2 - containerRect.top;
            const radius = Math.max(200, data.cols.length * 16);
            const cols = data.cols;
            const angleStep = (2 * Math.PI) / cols.length;

            cols.forEach((col, idx) => {
                const angle = idx * angleStep - Math.PI/2;
                const attrCx = cx + Math.cos(angle) * radius;
                const attrCy = cy + Math.sin(angle) * radius;
                const edgeX = cx + Math.cos(angle) * (rect.width/2 + 12);
                const edgeY = cy + Math.sin(angle) * (rect.height/2 + 12);

                const line = document.createElementNS(svgNS, 'line');
                line.setAttribute('x1', edgeX); line.setAttribute('y1', edgeY);
                line.setAttribute('x2', attrCx); line.setAttribute('y2', attrCy);
                line.classList.add('attr-line'); svgLayer.appendChild(line);

                const textLength = col.name.length;
                const rx = Math.max(32, textLength * 9 + 12);
                const ry = 20;

                const ellipse = document.createElementNS(svgNS, 'ellipse');
                ellipse.setAttribute('cx', attrCx); ellipse.setAttribute('cy', attrCy);
                ellipse.setAttribute('rx', rx); ellipse.setAttribute('ry', ry);
                ellipse.classList.add('attr-ellipse');
                if (col.pk) ellipse.classList.add('pk');
                else if (col.fk) ellipse.classList.add('fk');
                svgLayer.appendChild(ellipse);

                const text = document.createElementNS(svgNS, 'text');
                text.setAttribute('x', attrCx); text.setAttribute('y', attrCy);
                text.setAttribute('class', 'attr-text');
                text.textContent = col.name;
                svgLayer.appendChild(text);

                if (col.fk) {
                    const rel = fkRelations.find(r => r[0] === name && r[1] === col.name);
                    if (rel) {
                        ellipse.style.cursor = 'pointer';
                        ellipse.addEventListener('click', (e) => {
                            e.stopPropagation();
                            navigateToTable(rel[2]);
                        });
                    }
                }
            });
        }

        for (const rel of relations) {
            const fromCard = document.getElementById(`entity-${rel.from}`);
            const toCard = document.getElementById(`entity-${rel.to}`);
            if (!fromCard || !toCard) continue;
            const fromRect = fromCard.getBoundingClientRect();
            const toRect = toCard.getBoundingClientRect();
            const fromCx = fromRect.left + fromRect.width/2 - containerRect.left;
            const fromCy = fromRect.top + fromRect.height/2 - containerRect.top;
            const toCx = toRect.left + toRect.width/2 - containerRect.left;
            const toCy = toRect.top + toRect.height/2 - containerRect.top;
            const midX = (fromCx + toCx) / 2;
            const midY = (fromCy + toCy) / 2;

            const line1 = document.createElementNS(svgNS, 'line');
            line1.setAttribute('x1', fromCx); line1.setAttribute('y1', fromCy);
            line1.setAttribute('x2', midX); line1.setAttribute('y2', midY);
            line1.classList.add('er-line'); svgLayer.appendChild(line1);

            const line2 = document.createElementNS(svgNS, 'line');
            line2.setAttribute('x1', midX); line2.setAttribute('y1', midY);
            line2.setAttribute('x2', toCx); line2.setAttribute('y2', toCy);
            line2.classList.add('er-line'); svgLayer.appendChild(line2);

            const diamondSize = 30;
            const points = `${midX},${midY - diamondSize} ${midX + diamondSize},${midY} ${midX},${midY + diamondSize} ${midX - diamondSize},${midY}`;
            const poly = document.createElementNS(svgNS, 'polygon');
            poly.setAttribute('points', points);
            poly.classList.add('er-diamond');
            svgLayer.appendChild(poly);

            const text = document.createElementNS(svgNS, 'text');
            text.setAttribute('x', midX); text.setAttribute('y', midY);
            text.setAttribute('class', 'er-verb');
            text.textContent = rel.verb;
            svgLayer.appendChild(text);
        }
    }

            if (card) {
                const left = parseFloat(card.style.left), top = parseFloat(card.style.top);
                minX = Math.min(minX, left); minY = Math.min(minY, top);
                maxX = Math.max(maxX, left + card.offsetWidth);
                maxY = Math.max(maxY, top + card.offsetHeight);
            }
        }
        if (minX === Infinity) return;
        const w = maxX - minX, h = maxY - minY;
        const scrollX = Math.max(0, minX - (containerRect.width - w)/2);
        const scrollY = Math.max(0, minY - (containerRect.height - h)/2);
        canvasContainer.scrollTo({ left: scrollX, top: scrollY, behavior: 'smooth' });
    }

    function arrangeAllGrid() {
        document.querySelectorAll('.process-item').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.entity-rect').forEach(c => c.classList.remove('highlight'));
        const cols = 7, startX = 120, startY = 120, colSpacing = 550, rowSpacing = 500;
        const tableNames = Object.keys(tablesData);
        tableNames.forEach((tname, index) => {
            const col = index % cols, row = Math.floor(index / cols);
            const x = startX + col * colSpacing, y = startY + row * rowSpacing;
            tablesData[tname].pos = { x, y };
            const card = document.getElementById(`entity-${tname}`);
            if (card) { card.style.left = `${x}px`; card.style.top = `${y}px`; }
        });
        updateERDiagram();
        centerViewOnly();
    }

    function arrangeByProcesses() {
        document.querySelectorAll('.process-item').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.entity-rect').forEach(c => c.classList.remove('highlight'));
        const processLayout = {
            gestion_personas: { x: 120, y: 120, cols: 4, width: 700, vgap: 600 },
            denuncias: { x: 120, y: 760, cols: 5, width: 650, vgap: 600 },
            conciliacion: { x: 120, y: 1400, cols: 4, width: 700, vgap: 600 },
            personal_asistencia: { x: 120, y: 2040, cols: 4, width: 700, vgap: 600 },
            seguridad: { x: 120, y: 2680, cols: 5, width: 650, vgap: 600 },
            auditoria: { x: 120, y: 3320, cols: 3, width: 700, vgap: 600 },
            apoyo: { x: 120, y: 3960, cols: 4, width: 700, vgap: 600 },
            chatbot: { x: 120, y: 4600, cols: 5, width: 650, vgap: 600 }
        };
        const tablesByGroup = {};
        for (const g of Object.keys(processLayout)) tablesByGroup[g] = [];
        for (const [name, data] of Object.entries(tablesData)) {
            const g = data.group || "apoyo";
            if (tablesByGroup[g]) tablesByGroup[g].push(name);
        }
        for (const [groupName, layout] of Object.entries(processLayout)) {
            const tables = tablesByGroup[groupName] || [];
            let col = 0, row = 0;
            for (const tname of tables) {
                const x = layout.x + (col * layout.width);
                const y = layout.y + (row * layout.vgap);
                if (tablesData[tname]) tablesData[tname].pos = { x, y };
                col++;
                if (col >= layout.cols) { col = 0; row++; }
            }
        }
        renderEntities();
        requestAnimationFrame(() => centerViewOnly());
    }

    function onMouseMove(e) {
        if (!dragActive || !currentDragElem) return;
        const dx = e.clientX - startX, dy = e.clientY - startY;
        let newLeft = dragOffsetX + dx, newTop = dragOffsetY + dy;
        currentDragElem.style.left = `${newLeft}px`; currentDragElem.style.top = `${newTop}px`;
        const tableId = currentDragElem.id.replace('entity-', '');
        if (tablesData[tableId]) tablesData[tableId].pos = { x: newLeft, y: newTop };
        updateERDiagram();
    }
    function onMouseUp() { dragActive = false; if(currentDragElem) currentDragElem.style.zIndex = ''; currentDragElem = null; }

    function toggleSidebar() {
        isSidebarVisible = !isSidebarVisible;
        sidebar.classList.toggle('hidden', !isSidebarVisible);
        toggleSidebarBtn.textContent = isSidebarVisible ? '📋 Ocultar lista' : '📋 Mostrar lista';
        statusMsg.classList.toggle('sidebar-hidden', !isSidebarVisible);
    }

    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
    window.addEventListener('resize', () => updateERDiagram());
    new ResizeObserver(() => updateERDiagram()).observe(canvasContainer);
    canvasContainer.addEventListener('scroll', () => updateERDiagram());

    renderEntities();
    renderTableList();
    renderProcessList();
    searchInput.addEventListener('input', (e) => renderTableList(e.target.value));
    resetViewBtn.addEventListener('click', arrangeAllGrid);
    arrangeProcessBtn.addEventListener('click', arrangeByProcesses);
    toggleSidebarBtn.addEventListener('click', toggleSidebar);
    closeDetailBtn.addEventListener('click', () => { detailPanel.style.display = 'none'; });
    canvasContainer.addEventListener('click', (e) => { if (!e.target.closest('.entity-rect') && !e.target.closest('.attr-ellipse')) detailPanel.style.display = 'none'; });

    zoomInBtn.addEventListener('click', () => { currentZoom = Math.min(currentZoom + 0.1, 3); applyZoom(); });
    zoomOutBtn.addEventListener('click', () => { currentZoom = Math.max(currentZoom - 0.1, 0.3); applyZoom(); });
    zoomResetBtn.addEventListener('click', () => { currentZoom = 1; applyZoom(); centerViewOnly(); });

    setTimeout(() => arrangeByProcesses(), 100);
</script>
</body>
</html>
